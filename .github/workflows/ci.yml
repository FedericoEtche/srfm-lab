# ═══════════════════════════════════════════════════════════════════════════
# CI — PHASE 1 (minimal, honest, green)
#
# This workflow intentionally covers only what actually passes on master
# today. The previous workflow was rejected by GitHub's parser (job-level
# `if: hashFiles(...)` on the julia job is not allowed), so every run failed
# in 0s with 0 jobs — and beyond that, every job was structurally unpassable.
#
# Jobs REMOVED in phase 1 — what phase 2 needs to restore each:
#   python-extension  — needs a real maturin project in extensions/ (currently
#                       no Cargo.toml/pyproject.toml there; fast_indicators is a
#                       setuptools C extension, srfm_core is pure Python in lib/).
#   go                — needs either a root go.mod/go.work or a per-module
#                       matrix over the 25 per-dir modules (cmd/gateway does not
#                       exist; lib/ has no Go files).
#   typescript-arena lint — needs eslint added as a devDependency + config in
#                       spacetime/web (tsc + build are covered by `web` below).
#   typescript-terminal — needs terminal/package-lock.json so `npm ci` can run.
#   julia             — needs tests moved to julia/test/runtests.jl (they live
#                       at julia/tests/) or an explicit include() runner; and no
#                       job-level hashFiles() condition (GitHub rejects it).
#   integration       — needs fastapi/uvicorn installed (they are only in
#                       pyproject [project.dependencies], not requirements.txt)
#                       and a bootable spacetime.api.main:app.
#   sql-lint          — was continue-on-error noise; restore behind a real
#                       sqlfluff cleanup if wanted.
#
# Rust crates EXCLUDED from the check (fail to compile on a fresh toolchain;
# fix in phase 2, then drop the --exclude flags):
#   orderbook-sim      — TradeRecord lacks Default (CircularBuffer bound),
#                        crossbeam Sender::is_disconnected doesn't exist,
#                        unaligned packed-struct field refs (E0793).
#   network-graph      — 2 type errors (E0277 usize-vs-f64 sum, E0308).
#   synthetic-exchange — duplicate type definitions (E0255: MarketMakerAgent,
#                        Side, PopulationStats) + missing ordered_float dep.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Rust — workspace type-check minus the 3 crates that don't compile (see
  # header). 34 of 37 workspace members pass today.
  # NO `cargo fmt --check` (6,187 diffs) and NO clippy gating yet: both are
  # staged for phase 2 behind a dedicated formatting/lint cleanup commit.
  # ───────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check workspace (minus broken crates — see header comment)
        run: >
          cargo check --workspace
          --exclude orderbook-sim
          --exclude network-graph
          --exclude synthetic-exchange

  # ───────────────────────────────────────────────────────────────────────────
  # Web — spacetime/web (Vite + TypeScript). npm ci + tsc + build pass today.
  # (No `npm run lint`: eslint is not a dependency and has no config — phase 2.)
  # ───────────────────────────────────────────────────────────────────────────
  web:
    name: Web build (spacetime/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacetime/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: spacetime/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # Python — curated test subset that genuinely passes today.
  #
  # The FULL suite is blocked on the lib/-shadowing fix (phase 2): running all
  # of tests/ has 73 deterministic failures (lib/ shadowing + tests that import
  # deps only declared in pyproject [project.dependencies], e.g. fastapi,
  # scikit-learn, statsmodels). tests/test_strategies.py is excluded because 3
  # tests still fail (2 need scikit-learn, 1 hits a numpy read-only-assignment
  # bug in lib/factor_models). No ruff gate yet: 4,983 outstanding errors —
  # phase 2 behind a lint cleanup.
  #
  # Every file listed below passes in a fresh env with exactly
  # `pip install -r requirements.txt pytest` (verified per-file, 565 tests).
  # ───────────────────────────────────────────────────────────────────────────
  python-core:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run curated test subset
        env:
          PYTHONPATH: .
        run: |
          pytest \
            tests/test_agents.py \
            tests/test_archaeology.py \
            tests/test_bh_engine.py \
            tests/test_correlation.py \
            tests/test_data_loader.py \
            tests/test_mc.py \
            tests/test_microstructure_bridge.py \
            tests/test_monte_carlo.py \
            tests/test_onchain_bridge.py \
            tests/test_options_analytics.py \
            tests/test_options_risk.py \
            tests/test_portfolio.py \
            tests/test_quat_nav_bridge.py \
            tests/test_risk.py \
            tests/test_sensitivity.py \
            tests/test_srfm_core.py \
            tests/integration/test_risk_api_integration.py \
            --tb=short
